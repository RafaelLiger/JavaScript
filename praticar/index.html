<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
</head>
<body>

  <h2>Contato</h2>

  <input type="text" id="nome" placeholder="Seu nome">
  <button onclick="enviar()">Enviar</button>

  <script>
    function enviar() {
      let nome = document.getElementById("nome").value
      
      if(nome = "") {
        alert("Digite seu nome")
      } else {
        alert("Enviado com sucesso!")
      }
    }
  </script>

</body>
</html>
